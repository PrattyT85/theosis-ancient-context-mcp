[project]
name = "theosis-ancient-context-mcp"
version = "0.1.0"
description = "FastMCP stdio service for ancient text corpora: TLA, Coptic SCRIPTORIUM, Hittite HPM/HDivT, Ugaritic CUC, DASI, OCIANA, CDLI, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PrattyT85" }]
keywords = ["mcp", "ancient-texts", "egyptology", "coptic", "hittite", "ugaritic", "assyriology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
theosis-ancient-context-mcp = "theosis_ancient_context.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theosis_ancient_context"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
